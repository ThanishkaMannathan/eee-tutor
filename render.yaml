services:
  - type: web
    name: eee-tutor-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir webapp app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CLAUDE_API_KEY
        sync: false
      - key: STUDENT_LEVEL
        value: beginner
      - key: STUDENT_YEAR
        value: 2
